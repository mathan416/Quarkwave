<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 740" role="img" aria-labelledby="title desc">
  <title id="title">QuarkWave proposed mono line output, with separate signal and power paths</title>
  <desc id="desc">Signal runs left to right: Uno A0, 1 kilohm resistor R1, MCP6002 buffer input pin 3, buffer output pin 1, 10 kilohm resistor R2, 10 microfarad coupling capacitor C2, and mono jack tip. The output node also passes through 10 kilohm resistor R3 to Uno ground. Jack sleeve connects to Uno ground. Separate power inset: Uno 5 volts connects to op amp pin 8, Uno ground connects to pin 4, and 100 nanofarad capacitor C1 bridges those two rails. Buffer pin 1 connects directly to pin 2. Unused channel pins 6 and 7 connect together; pin 5 connects to ground.</desc>
  <style>
    .background{fill:#0b1728}.card{fill:#142a3b;stroke:#589bb5;stroke-width:2}.chip{fill:#242336;stroke:#ac90c7;stroke-width:2}.line{fill:none;stroke:#32bdd6;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.power{fill:none;stroke:#b6a4d2;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 5}.gnd{fill:none;stroke:#7bd6a2;stroke-width:3;stroke-linecap:round}.point{fill:#32bdd6}.title{font:700 30px system-ui,sans-serif;fill:#f4f7fb}.section{font:700 21px system-ui,sans-serif;fill:#f4f7fb}.label{font:600 19px system-ui,sans-serif;fill:#f1f6fa}.body{font:18px system-ui,sans-serif;fill:#c8d4df}.small{font:16px system-ui,sans-serif;fill:#b9c9d8}
  </style>
  <rect class="background" width="1480" height="740" rx="22"/>
  <text class="title" x="48" y="56">Uno R4 A0 → buffered mono line output</text>
  <text class="body" x="48" y="89">One path for audio, one for power. Proposed circuit; it has not been built or measured.</text>

  <rect class="card" x="38" y="126" width="1404" height="342" rx="15"/>
  <text class="section" x="62" y="165">1  Audio signal: read left to right</text>

  <text class="label" x="59" y="265">Uno A0</text>
  <path class="line" d="M154 258 H188 M288 258 H355 M583 258 H641 M741 258 H805 M849 258 H1060 M1060 258 H1170"/>
  <rect class="card" x="188" y="232" width="100" height="52" rx="5"/>
  <text class="label" x="202" y="266">R1 1 kΩ</text>

  <rect class="chip" x="355" y="202" width="228" height="111" rx="12"/>
  <text class="section" x="379" y="237">U1 MCP6002</text>
  <text class="body" x="379" y="267">pin 3 (+) → pin 1 OUT</text>
  <text class="small" x="379" y="294">pin 1 joined to pin 2 (−)</text>

  <rect class="card" x="641" y="232" width="100" height="52" rx="5"/>
  <text class="label" x="652" y="266">R2 10 kΩ</text>

  <path class="line" d="M805 229 V287 M849 229 V287"/>
  <text class="label" x="789" y="217">C2 10 µF</text>
  <text class="small" x="761" y="328">bipolar; or + toward U1</text>

  <circle class="point" cx="1060" cy="258" r="6"/>
  <path class="line" d="M1060 258 V334 M1060 390 V411"/>
  <rect class="card" x="1037" y="334" width="46" height="56" rx="5"/>
  <text class="label" x="1092" y="369">R3 10 kΩ</text>
  <path class="gnd" d="M1039 411 H1081 M1045 421 H1075 M1052 431 H1068"/>
  <text class="small" x="1092" y="421">Uno GND</text>

  <rect class="card" x="1170" y="219" width="242" height="78" rx="10"/>
  <text class="label" x="1190" y="249">J1 mono TS jack</text>
  <text class="body" x="1190" y="275">tip = signal</text>
  <path class="gnd" d="M1290 297 V411"/>
  <path class="gnd" d="M1269 411 H1311 M1275 421 H1305 M1282 431 H1298"/>
  <text class="small" x="1316" y="419">sleeve = Uno GND</text>
  <text class="small" x="62" y="452">Connect J1 to a powered speaker LINE input or a mixer LINE input. Do not connect headphones directly to J1.</text>

  <rect class="card" x="38" y="486" width="680" height="205" rx="15"/>
  <text class="section" x="62" y="527">2  Power the buffer from the Uno</text>
  <text class="label" x="62" y="567">Uno 5 V</text>
  <path class="power" d="M175 560 H559"/>
  <text class="label" x="566" y="567">U1 pin 8</text>
  <path class="power" d="M315 560 V577"/>
  <path class="gnd" d="M315 601 V629 H175 M315 629 H559"/>
  <path class="line" d="M292 577 H338 M292 601 H338"/>
  <text class="small" x="347" y="594">C1 100 nF</text>
  <text class="label" x="62" y="637">Uno GND</text>
  <text class="label" x="566" y="637">U1 pin 4</text>
  <text class="small" x="62" y="674">Place C1 beside U1. Use Uno 5 V only; leave Pico 5 V separate.</text>

  <rect class="card" x="738" y="486" width="704" height="205" rx="15"/>
  <text class="section" x="762" y="527">3  Tie off the unused half of U1</text>
  <text class="body" x="762" y="568">Pin 5 (+B) → Uno GND</text>
  <text class="body" x="762" y="600">Pin 6 (−B) → pin 7 (OUT B)</text>
  <text class="small" x="762" y="651">All ground symbols on this page connect to Uno GND.</text>
<text class="small" x="48" y="721">Diagram colors indicate signal, supply, and ground functions; they do not identify jumper colors.</text>
</svg>
