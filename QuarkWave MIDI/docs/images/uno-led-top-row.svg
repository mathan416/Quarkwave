<g transform="translate(387,0)"><rect x="0" y="112" width="76" height="204" rx="12" fill="#142a3b" stroke="#589bb5" stroke-width="1.5"/><text x="38" y="152" text-anchor="middle" class="number">5</text><circle cx="38" cy="211" r="19" fill="#ff6767" stroke="#ff9b9b" stroke-width="2"/><circle cx="32" cy="205" r="4" fill="#ffd0d0" opacity=".72"/><text x="38" y="258" text-anchor="middle" class="state">LIT</text><text x="38" y="289" text-anchor="middle" class="label">Arp</text></g>
<g transform="translate(472,0)"><rect x="0" y="112" width="76" height="204" rx="12" fill="#142a3b" stroke="#589bb5" stroke-width="1.5"/><text x="38" y="152" text-anchor="middle" class="number">6</text><circle cx="38" cy="211" r="19" fill="#ff6767" stroke="#ff9b9b" stroke-width="2"/><circle cx="32" cy="205" r="4" fill="#ffd0d0" opacity=".72"/><text x="38" y="258" text-anchor="middle" class="state">LIT</text><text x="38" y="289" text-anchor="middle" class="label">Pico link</text></g>
