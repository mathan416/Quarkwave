<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">Illustrative Uno LED matrix views</title>
<desc id="desc">Status shows four horizontal voice envelope bars. VU shows eleven vertical bars of recent mono output level with a peak dot in the twelfth column. Scope shows a waveform trace. The top row carries sound, performance, connection, timing, and heartbeat indicators; a note-start flash can appear in any view.</desc>
