<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="388" viewBox="0 0 1120 388" role="img" aria-labelledby="title desc">
<title id="title">Uno LED matrix top-row indicator map, columns one through twelve</title>
<desc id="desc">Twelve numbered LEDs. Columns 1 to 5 show Pico sound loaded, external MIDI used, valid external clock, sustain, and arpeggiator. Columns 6 to 12 show Pico link, Pico receive, voice steal, external MIDI activity, note start, audio timing slip, and heartbeat. This example shows selected LEDs lit; brief event LEDs are labeled flash.</desc>
<style>.head{font:700 26px system-ui,sans-serif;fill:#f4f7fb}.sub{font:15px system-ui,sans-serif;fill:#b9c9d8}.number{font:700 20px system-ui,sans-serif;fill:#f4f7fb}.state{font:700 12px system-ui,sans-serif;fill:#c8d4df;letter-spacing:.5px}.label{font:13px system-ui,sans-serif;fill:#c8d4df}.foot{font:14px system-ui,sans-serif;fill:#d2dbe4}</style>
<rect width="1120" height="388" rx="22" fill="#0b1728"/>
<text x="42" y="47" class="head">Uno R4 LED matrix · top row</text>
<text x="42" y="75" class="sub">Columns 1–12, left to right as viewed on the board · illustrative moment</text>
<g transform="translate(47,0)"><rect x="0" y="112" width="76" height="204" rx="12" fill="#142a3b" stroke="#589bb5" stroke-width="1.5"/><text x="38" y="152" text-anchor="middle" class="number">1</text><circle cx="38" cy="211" r="19" fill="#ff6767" stroke="#ff9b9b" stroke-width="2"/><circle cx="32" cy="205" r="4" fill="#ffd0d0" opacity=".72"/><text x="38" y="258" text-anchor="middle" class="state">LIT</text><text x="38" y="289" text-anchor="middle" class="label">Pico sound</text></g>
<g transform="translate(132,0)"><rect x="0" y="112" width="76" height="204" rx="12" fill="#142a3b" stroke="#589bb5" stroke-width="1.5"/><text x="38" y="152" text-anchor="middle" class="number">2</text><circle cx="38" cy="211" r="19" fill="#39485b" stroke="#7388a3" stroke-width="2"/><text x="38" y="258" text-anchor="middle" class="state">DARK</text><text x="38" y="289" text-anchor="middle" class="label">External</text></g>
<g transform="translate(217,0)"><rect x="0" y="112" width="76" height="204" rx="12" fill="#142a3b" stroke="#589bb5" stroke-width="1.5"/><text x="38" y="152" text-anchor="middle" class="number">3</text><circle cx="38" cy="211" r="19" fill="#39485b" stroke="#7388a3" stroke-width="2"/><text x="38" y="258" text-anchor="middle" class="state">DARK</text><text x="38" y="289" text-anchor="middle" class="label">Clock</text></g>
