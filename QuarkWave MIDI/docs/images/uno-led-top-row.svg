<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="388" viewBox="0 0 1120 388" role="img" aria-labelledby="title desc">
<title id="title">Uno LED matrix top-row indicator map, columns one through twelve</title>
<desc id="desc">Twelve numbered LED positions from left to right. An illustrative Status-view moment shows Uno Wi-Fi columns 1 to 3 and Uno RTP column 5 unlit, Pico link 6 and receive 7 lit, external sound activity 9, Note 10, and heartbeat 12 lit. BLE column 4 and unused columns 8 and 11 are unlit. Some lit indicators flash or depend on connections.</desc>
<style>.head{font:700 26px system-ui,sans-serif;fill:#f4f7fb}.sub{font:15px system-ui,sans-serif;fill:#b9c9d8}.number{font:700 20px system-ui,sans-serif;fill:#f4f7fb}.state{font:700 13px system-ui,sans-serif;fill:#c8d4df;letter-spacing:1px}.label{font:13px system-ui,sans-serif;fill:#c8d4df}.foot{font:14px system-ui,sans-serif;fill:#d2dbe4}</style>
<rect width="1120" height="388" rx="22" fill="#0b1728"/>
<text x="42" y="47" class="head">Uno R4 LED matrix · top row</text>
<text x="42" y="75" class="sub">Columns 1–12, left to right as viewed on the board · illustrative Status-view moment</text>
