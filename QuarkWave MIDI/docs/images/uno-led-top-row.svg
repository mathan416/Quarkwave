translate(812,0)"><rect x="0" y="112" width="76" height="204" rx="12" fill="#142a3b" stroke="#589bb5" stroke-width="1.5"/><text x="38" y="152" text-anchor="middle" class="number">10</text><circle cx="38" cy="211" r="19" fill="#ff6767" stroke="#ff9b9b" stroke-width="2"/><circle cx="32" cy="205" r="4" fill="#ffd0d0" opacity=".72"/><text x="38" y="258" text-anchor="middle" class="state">ON</text><text x="38" y="289" text-anchor="middle" class="label">Note</text></g><g transform="translate(897,0)"><rect x="0" y="112" width="76" height="204" rx="12" fill="#142a3b" stroke="#589bb5" stroke-width="1.5"/><text x="38" y="152" text-anchor="middle" class="number">11</text><circle cx="38" cy="211" r="19" fill="#39485b" stroke="#7388a3" stroke-width="2"/><text x="38" y="258" text-anchor="middle" class="state">OFF</text><text x="38" y="289" text-anchor="middle" class="label">unused</text></g><g transform="translate(982,0)"><rect x="0" y="112" width="76" height="204" rx="12" fill="#142a3b" stroke="#589bb5" stroke-width="1.5"/><text x="38" y="152" text-anchor="middle" class="number">12</text><circle cx="38" cy="211" r="19" fill="#ff6767" stroke="#ff9b9b" stroke-width="2"/><circle cx="32" cy="205" r="4" fill="#ffd0d0" opacity=".72"/><text x="38" y="258" text-anchor="middle" class="state">ON</text><text x="38" y="289" text-anchor="middle" class="label">Heartbeat</text></g>
