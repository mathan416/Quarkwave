<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
<title id="title">QuarkWave MIDI system overview</title>
<desc id="desc">Browser connects to Pico over Wi-Fi. Pico and Uno exchange MIDI over a two-way UART link. Uno generates DAC audio. Pico keeps patch storage; a separate DIN input reaches the Uno, while RTP-MIDI reaches the Pico.</desc>
<defs><marker id="right" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#32bdd6"/></marker><marker id="left" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#f5b85b"/></marker></defs>
